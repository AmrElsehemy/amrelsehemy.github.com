<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b0d10">
  <title>{{ page.title | default: site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  <meta property="og:title" content="{{ page.title | default: site.title }}">
  <meta property="og:description" content="{{ page.description | default: site.description }}">
  <meta property="og:type" content="website">
  <meta property="og:url" content="{{ site.url }}{{ page.url }}">
  <meta name="twitter:card" content="summary">
  <link rel="canonical" href="{{ site.url }}{{ page.url }}">
  <link rel="stylesheet" href="{{ '/css/main.css' | relative_url }}">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="{{ '/' | relative_url }}" aria-label="Amr Elsehemy home">AE</a>
    <nav class="site-nav" aria-label="Primary navigation">
      <a href="#work">Work</a>
      <a href="#now">Now</a>
      <a href="#contact">Contact</a>
    </nav>
  </header>

  <main>
    {{ content }}
  </main>

  <footer class="site-footer" id="contact">
    <div>
      <strong>Amr Elsehemy</strong>
      <p>AI, products, systems, and the occasional race.</p>
    </div>
    <div class="footer-links">
      <a href="https://github.com/AmrElsehemy" rel="me">GitHub</a>
      <a href="https://www.linkedin.com/in/amrelsehemy/" rel="me">LinkedIn</a>
      <a href="https://knowlly.ai/">Knowlly</a>
    </div>
  </footer>
</body>
</html>
