<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4f1ea">
  <meta name="color-scheme" content="light">
  <title>{{ page.title | default: site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  <meta property="og:title" content="{{ page.title | default: site.title }}">
  <meta property="og:description" content="{{ page.description | default: site.description }}">
  <meta property="og:type" content="website">
  <meta property="og:url" content="{{ site.url }}{{ page.url }}">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="canonical" href="{{ site.url }}{{ page.url }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/css/main.css' | relative_url }}">
</head>
<body>
  <div class="page-shell">
    <header class="site-header">
      <a class="wordmark" href="#top" aria-label="Amr Elsehemy home">AMR ELSEHEMY<span>.</span></a>
      <nav class="site-nav" aria-label="Primary navigation">
        <a href="#builds">Builds</a>
        <a href="#thinking">Thinking</a>
        <a href="#connect">Connect</a>
      </nav>
    </header>

    <main id="top">
      {{ content }}
    </main>

    <footer class="site-footer" id="connect">
      <p class="footer-cta">Have an ambitious idea?<br><strong>Make it real.</strong></p>
      <div class="footer-meta">
        <p>Cairo, Egypt · Building globally</p>
        <div class="footer-links">
          <a href="https://www.linkedin.com/in/amrelsehemy/" rel="me">LinkedIn ↗</a>
          <a href="https://github.com/AmrElsehemy" rel="me">GitHub ↗</a>
          <a href="https://knowlly.ai/">Knowlly ↗</a>
        </div>
      </div>
      <p class="copyright">© {{ 'now' | date: '%Y' }} Amr Elsehemy</p>
    </footer>
  </div>
</body>
</html>
